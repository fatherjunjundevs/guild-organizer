name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04

    env:
      APP_ENV: local
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      INVITE_SIGNING_SECRET: ci-invite-signing-secret-at-least-32-characters
      SUPABASE_AUTH_DISCORD_CLIENT_ID: "123456789012345678"
      SUPABASE_AUTH_DISCORD_SECRET: "ci-discord-secret-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Start local Supabase for end-to-end tests
        run: pnpm db:start

      - name: Reset end-to-end database
        run: pnpm db:reset

      - name: Configure application for local Supabase
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          if [ -n "${PUBLISHABLE_KEY:-}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          fi

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Stop local Supabase after end-to-end tests
        if: always()
        run: pnpm db:stop

  database:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      SUPABASE_AUTH_DISCORD_CLIENT_ID: "123456789012345678"
      SUPABASE_AUTH_DISCORD_SECRET: "ci-discord-secret-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Reset database from migrations
        run: pnpm db:reset

      - name: Lint database schema
        run: pnpm db:lint

      - name: Database tests
        run: pnpm db:test

      - name: Verify generated database types
        run: pnpm db:types:check

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
